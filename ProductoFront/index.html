<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bootstrap-5.0.2-dist/bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>

<body>

    <h1>Agregar un Producto...</h1>
    <hr>

    <!-- AGREGAR PRODUCTO -->

    <div class="row">
        <div class="col-md-3">
            <input type="text" id="nombreProducto" placeholder="Nombre" required>
        </div>

        <div class="col-md-3">
            <input type="text" id="descripcionProducto" placeholder="Descripcion" required>
        </div>

        <div class="col-md-3">
            <input type="number" step="0,01" id="precioCosto" placeholder="Precio Costo" required>
        </div>

        <div class="col-md-3">
            <input type="number" step="0,01" id="precioVenta" placeholder="Precio Venta" required>
        </div>
        <div>
            <button class="btn btn-primary w-100" id="btnGuardar" onclick="AgregarProducto()">
                Guardar
            </button>
        </div>
    </div>

    <!-- Modal EDITAR -->

     <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="exampleModalLabel">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <input type="hidden" id="idEditar">
                    <input type="text" id="nombreEditar" placeholder="Ingrese nuevo Nombre">
                    <input type="text" id="descripcionEditar" placeholder="Ingrese nueva Descripcion">
                    <input type="number" step="0,01" id="precioCostoEditar" placeholder="Ingrese nuevo Precio Costo">
                    <input type="number" step="0,01" id="precioVentaEditar" placeholder="Ingrese nuevo Precio Venta">

                </div>
                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="EditarProducto()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TABLA PRODUCTOS -->
     
    <table class="table">
        <thead>
            <tr>
                <th scope="col">Nombre</th>
                <th scope="col">Descripcion</th>
                <th scope="col">Precio Costo</th>
                <th scope="col">Precio Venta</th>
                <th scope="col">Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaProducto" class="table-group-divider"></tbody>
    </table>





    <script src="bootstrap-5.0.2-dist/bootstrap-5.0.2-dist/js/bootstrap.min.js"></script>
    <script src="Js/Producto.1.0.0.js"></script>
    <script src="Js/jquery.js"></script>

</body>

</html>
